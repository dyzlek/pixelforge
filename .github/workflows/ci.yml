name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run test suite
        run: npm test

      - name: Verify node documentation is up to date
        run: npm run check:doc

      - name: Validate sample games
        run: |
          npm run pf -- validate tetris
          npm run pf -- validate exemple-plateforme-qiqv
          npm run pf -- validate monde-1-1
          npm run pf -- validate cube-runner
          npm run pf -- validate donjon-3d
          npm run pf -- validate adventure-3d

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e

